<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>HostFS</title>
  <style>
    :root {
      --bg: #d4d0c8;
      --toolbar: #c0bdb5;
      --border: #888888;
      --text: #000000;
      --entry-hover: #e8e4dc;
      --entry-selected-bg: #000080;
      --entry-selected-text: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Homerton", "URW Bookman L", Georgia, serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    #toolbar {
      background: var(--toolbar);
      border-bottom: 1px solid var(--border);
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #path-display {
      flex: 1;
      font-size: 11px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button {
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: inherit;
    }

    button:hover { background: #c8c4bc; }

    #grid {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
    }

    .entry {
      width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 2px;
    }

    .entry:hover { background: var(--entry-hover); border-color: #aaa; }

    .entry.selected {
      background: var(--entry-selected-bg);
      color: var(--entry-selected-text);
      border-color: #000060;
    }

    .entry canvas,
    .entry .icon-placeholder {
      width: 34px;
      height: 34px;
      margin-bottom: 2px;
      display: block;
    }

    .icon-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .entry-name {
      text-align: center;
      word-break: break-word;
      font-size: 11px;
      max-width: 70px;
      line-height: 1.2;
    }

    .entry.selected .entry-name { color: var(--entry-selected-text); }

    #empty {
      display: none;
      padding: 20px;
      color: #666;
      font-style: italic;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-up" title="Parent directory">&#8593; Up</button>
    <span id="path-display">HostFS::$</span>
  </div>
  <div id="grid">
    <div id="empty">No files found</div>
  </div>
  <script type="module" src="./hostfs-browser.ts"></script>
</body>
</html>
