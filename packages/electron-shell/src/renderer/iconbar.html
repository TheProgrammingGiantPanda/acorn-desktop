<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Iconbar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 68px; overflow: hidden;
      background: rgba(180, 180, 180, 0.95);
      border-top: 2px solid #aaa;
      display: flex; align-items: center;
      padding: 4px 8px; gap: 12px;
      font-family: system-ui, sans-serif;
      -webkit-app-region: no-drag;
      user-select: none;
    }
    .icon-entry {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 4px 8px; border-radius: 4px;
      cursor: pointer; min-width: 64px;
    }
    .icon-entry:hover { background: rgba(255,255,255,0.4); }
    .icon-entry:active { background: rgba(0,0,0,0.1); }
    .icon-sprite {
      width: 40px; height: 40px;
      background: #5a7fa0;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .icon-label {
      font-size: 10px; color: #222;
      text-align: center; max-width: 72px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #clock {
      margin-left: auto; font-size: 13px; color: #222;
      font-variant-numeric: tabular-nums; padding: 0 8px;
    }
  </style>
</head>
<body>
  <div id="icons"></div>
  <div id="clock"></div>
  <script type="module" src="./iconbar.ts"></script>
</body>
</html>
