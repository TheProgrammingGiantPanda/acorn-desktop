<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Programs</title>
  <style>
    :root {
      --bg: #c8c8c8;
      --toolbar: #d4d0c8;
      --border-light: #ffffff;
      --border-dark: #808080;
      --border-darker: #404040;
      --text: #000000;
      --tile-bg: #c8c8c8;
      --tile-hover: #b0c8e8;
      --tile-selected: #0000a0;
      --tile-selected-text: #ffffff;
      --accent: #000080;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Homerton", "URW Bookman L", Georgia, serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Title bar area */
    header {
      background: var(--accent);
      color: #ffffff;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* Drop target highlight */
    body.drag-over #grid-area {
      outline: 3px dashed #0000a0;
      outline-offset: -3px;
    }

    /* Status bar */
    #statusbar {
      background: var(--toolbar);
      border-top: 1px solid var(--border-dark);
      padding: 2px 6px;
      font-size: 11px;
      color: #404040;
      flex-shrink: 0;
    }

    /* Scrollable grid area */
    #grid-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    #grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 4px 4px;
      width: 80px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 2px;
    }

    .tile:hover {
      background: var(--tile-hover);
      border-color: var(--border-dark);
    }

    .tile.selected {
      background: var(--tile-selected);
      border-color: var(--border-darker);
    }

    .tile.selected .tile-name {
      color: var(--tile-selected-text);
    }

    .tile-icon {
      width: 34px;
      height: 34px;
      image-rendering: pixelated;
      display: block;
    }

    .tile-name {
      margin-top: 4px;
      text-align: center;
      font-size: 11px;
      word-break: break-word;
      max-width: 76px;
      line-height: 1.2;
    }

    /* Empty state */
    #empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #606060;
      gap: 8px;
    }

    #empty.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <header>Programs — assets/programs</header>
  <div id="grid-area">
    <div id="grid"></div>
    <div id="empty">
      <p>No applications found.</p>
      <p style="font-size:11px">Drag a !App directory here to install it.</p>
    </div>
  </div>
  <div id="statusbar">Ready</div>

  <script type="module" src="./programs-browser.ts"></script>
</body>
</html>
