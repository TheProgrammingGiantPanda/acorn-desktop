<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Acorn Desktop</title>
  <style>
    :root {
      --bg: #1a1a1a; --surface: #252525; --border: #3a3a3a;
      --text: #e0e0e0; --muted: #888; --accent: #d4550a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, sans-serif; font-size: 13px;
      display: flex; flex-direction: column;
    }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; color: var(--accent); }
    header p  { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .toolbar {
      display: flex; gap: 8px; padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }
    button {
      padding: 6px 16px; background: #303030;
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); cursor: pointer; font-size: 12px;
    }
    button:hover { background: #3d3d3d; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover { background: #e8661a; }

    #drop-zone {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; border: 2px dashed var(--border);
      margin: 16px 24px; border-radius: 8px; color: var(--muted);
      transition: border-color 0.15s;
    }
    #drop-zone.active { border-color: var(--accent); color: var(--text); }
    #drop-zone svg { width: 40px; height: 40px; opacity: 0.4; }
    #status { padding: 8px 24px; font-size: 11px; color: var(--muted);
              border-top: 1px solid var(--border); }
    #console {
      background: #0d0d0d; padding: 8px 12px; margin: 0 24px 16px;
      border-radius: 4px; font-family: monospace; font-size: 11px;
      color: #7f7; height: 80px; overflow-y: auto;
      display: none;
    }
    #console.visible { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Acorn Desktop</h1>
    <p>Acorn Archimedes ARM2/ARM3 emulator &mdash; native window mode</p>
  </header>

  <div class="toolbar">
    <button class="primary" id="btn-load-rom">Load ROM&hellip;</button>
    <button id="btn-reset" disabled>Reset</button>
  </div>

  <div id="drop-zone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>Drop a RISC OS ROM file here</p>
    <p style="font-size:11px">.rom .bin .img</p>
  </div>

  <div id="console"></div>

  <div id="status">Ready — load a ROM to start</div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
